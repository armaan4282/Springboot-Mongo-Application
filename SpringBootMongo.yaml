apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-deployment
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springbootmongo
  template:
    metadata:
      labels:
        app: springbootmongo
    spec:
      containers:
      - name: spring-container
        image: armaan1234/springboot-mongo-application:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "300m"
            memory: "500Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        env:
        - name: MONGO_DB_HOSTNAME
          value: mongo-service
        - name: MONGO_DB_USERNAME
          value: production
        - name: MONGO_DB_PASSWORD
          value: production@123
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-service
  namespace: production
spec:
  type: NodePort
  selector:
    app: springbootmongo
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo-container
        image: mongo
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: production
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: production@123
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017
